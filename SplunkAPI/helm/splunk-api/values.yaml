replicaCount: 1

image:
  repository: splunk-api
  tag: "1"
  pullPolicy: Never

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: splunk-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: splunk-api-tls
      hosts:
        - splunk-api.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 10
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20

splunk:
  hec:
    url: "https://splunk.example.com:8088/services/collector/event"
    ignoreCertificateErrors: true

  search:
    preview: false
    maxOut: 100000
    maxTime: 60

  runtime:
    runningInKubernetes: true
    executable: /opt/splunk/bin/splunk

  kubernetes:
    namespace: data-stack
    pod: splunk-0
    container: splunk

secret:
  create: false
  existingSecret: splunk-api-secrets

  # Used only when create=true.
  searchApiToken: ""

rbac:
  create: true
  restrictToPodName: true

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
