apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "splunk-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splunk-api.labels" . | nindent 4 }}
data:
  SPLUNK_HEC_URL: {{ required "splunk.hec.url is required" .Values.splunk.hec.url | quote }}
  SPLUNK_HEC_IGNORE_CERT_ERRORS: {{ .Values.splunk.hec.ignoreCertificateErrors | quote }}

  SPLUNK_MANAGEMENT_URL: {{ required "splunk.management.url is required" .Values.splunk.management.url | quote }}
  SPLUNK_MANAGEMENT_IGNORE_CERT_ERRORS: {{ .Values.splunk.management.ignoreCertificateErrors | quote }}

  SPLUNK_SEARCH_MAXOUT: {{ .Values.splunk.search.maxOut | int | quote }}
  SPLUNK_SEARCH_MAXTIME: {{ .Values.splunk.search.maxTime | int | quote }}
  SPLUNK_SEARCH_POLL_INTERVAL_MS: {{ .Values.splunk.search.pollIntervalMs | int | quote }}

  SPLUNK_INGEST_MAX_BYTES: {{ .Values.splunk.ingest.maxBytes | int | quote }}
  SPLUNK_MCP_MAX_QUERY_LENGTH: {{ .Values.splunk.mcp.maxQueryLength | int | quote }}
{{- if .Values.oauth.enabled }}
SPLUNK_OAUTH_CLIENT_ID: {{ .Values.oauth.clientId | quote }}
SPLUNK_OAUTH_REDIRECT_URI: {{ .Values.oauth.redirectUri | quote }}
{{- if .Values.oauth.dbPath }}
SPLUNK_OAUTH_DB_PATH: {{ .Values.oauth.dbPath | quote }}
{{- end }}
{{- end }}