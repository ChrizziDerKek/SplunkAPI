{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splunk-api.fullname" . }}-secrets
type: Opaque
stringData:
  SPLUNK_API_TOKEN: {{ .Values.secret.apiToken | quote }}

  {{- if .Values.oauth.enabled }}
  SPLUNK_OAUTH_CLIENT_SECRET: {{ .Values.secret.apiToken | quote }}
  SPLUNK_OAUTH_USERNAME: {{ .Values.secret.oauthUsername | quote }}
  SPLUNK_OAUTH_PASSWORD: {{ .Values.secret.oauthPassword | quote }}
  {{- end }}
{{- end }}